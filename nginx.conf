server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кеши событий обновляются контейнером cache-updater —
    # браузер должен ревалидировать их, а не хранить год
    location ~ ^/(governance-cache|events|trees)/ {
        add_header Cache-Control "no-cache";
    }
}
